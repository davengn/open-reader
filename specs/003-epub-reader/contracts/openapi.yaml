openapi: 3.1.0
info:
  title: Open Reader EPUB Reader API
  version: 0.1.0
  description: Local route-handler contracts for streaming EPUB files, saving CFI progress, and managing EPUB highlights.
servers:
  - url: http://localhost:3000
paths:
  /api/books/{bookId}/file:
    get:
      summary: Stream a local EPUB file for epubjs
      operationId: streamEpubBookFile
      parameters:
        - $ref: "#/components/parameters/BookId"
      responses:
        "200":
          description: Raw EPUB bytes.
          headers:
            Content-Type:
              schema:
                type: string
                const: application/epub+zip
            Cache-Control:
              schema:
                type: string
          content:
            application/epub+zip:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Book exists but is not a ready EPUB reader target.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/books/{bookId}/progress:
    get:
      summary: Load saved EPUB reading progress
      operationId: getEpubBookProgress
      parameters:
        - $ref: "#/components/parameters/BookId"
      responses:
        "200":
          description: Saved EPUB progress or null when the book has never been read.
          content:
            application/json:
              schema:
                type: object
                required: [progress]
                properties:
                  progress:
                    oneOf:
                      - $ref: "#/components/schemas/EpubProgress"
                      - type: "null"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Book exists but is not an EPUB reader target.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: Save EPUB reading progress from debounce or keepalive flows
      operationId: saveEpubBookProgress
      parameters:
        - $ref: "#/components/parameters/BookId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveEpubProgressRequest"
      responses:
        "200":
          description: Progress saved.
          content:
            application/json:
              schema:
                type: object
                required: [progress]
                properties:
                  progress:
                    $ref: "#/components/schemas/EpubProgress"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Book exists but is not an EPUB reader target.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/highlights:
    get:
      summary: List EPUB highlights for one book
      operationId: listEpubHighlights
      parameters:
        - name: bookId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [epub]
      responses:
        "200":
          description: Highlights for the requested EPUB book.
          content:
            application/json:
              schema:
                type: object
                required: [highlights]
                properties:
                  highlights:
                    type: array
                    items:
                      $ref: "#/components/schemas/EpubHighlight"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Book exists but is not an EPUB reader target.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: Create an EPUB highlight
      operationId: createEpubHighlight
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEpubHighlightRequest"
      responses:
        "201":
          description: Highlight created.
          content:
            application/json:
              schema:
                type: object
                required: [highlight]
                properties:
                  highlight:
                    $ref: "#/components/schemas/EpubHighlight"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Book exists but is not an EPUB reader target.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/highlights/{highlightId}:
    delete:
      summary: Delete an EPUB highlight
      operationId: deleteEpubHighlight
      parameters:
        - name: highlightId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "204":
          description: Highlight deleted.
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    BookId:
      name: bookId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  schemas:
    HighlightColor:
      type: string
      enum: [yellow, green, blue, pink]
    EpubProgress:
      type: object
      required: [bookId, currentCfi, percentage, updatedAt]
      properties:
        bookId:
          type: string
        currentCfi:
          type: string
          minLength: 1
        chapter:
          type:
            - string
            - "null"
        percentage:
          type: number
          minimum: 0
          maximum: 100
        updatedAt:
          type: integer
          minimum: 0
    SaveEpubProgressRequest:
      type: object
      required: [currentCfi, percentage]
      properties:
        currentCfi:
          type: string
          minLength: 1
        chapter:
          type:
            - string
            - "null"
        percentage:
          type: number
          minimum: 0
          maximum: 100
    EpubHighlight:
      type: object
      required: [id, bookId, cfi, text, color, createdAt, updatedAt]
      properties:
        id:
          type: integer
          minimum: 1
        bookId:
          type: string
        cfi:
          type: string
          minLength: 1
        text:
          type: string
          minLength: 1
        color:
          $ref: "#/components/schemas/HighlightColor"
        chapter:
          type:
            - string
            - "null"
        createdAt:
          type: integer
          minimum: 0
        updatedAt:
          type: integer
          minimum: 0
    CreateEpubHighlightRequest:
      type: object
      required: [bookId, cfi, text, color]
      properties:
        bookId:
          type: string
          minLength: 1
        cfi:
          type: string
          minLength: 1
        text:
          type: string
          minLength: 1
        color:
          $ref: "#/components/schemas/HighlightColor"
        chapter:
          type:
            - string
            - "null"
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServerError:
      description: Local file or database operation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
